<!-- Place inside <head>. Upload the folders to your site root, or adjust the paths. -->

<!-- Favicons -->
<link rel="icon" href="/favicon/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/app/apple-touch-icon.png">
<link rel="manifest" href="/app/site.webmanifest">
<meta name="theme-color" content="#3B2A7A">
<meta name="msapplication-config" content="/browserconfig.xml">

<!-- Open Graph (Facebook, LinkedIn, WhatsApp, Slack) -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="CloutLabs">
<meta property="og:title" content="CloutLabs">
<meta property="og:description" content="Connecting content creators. Empowering growth.">
<meta property="og:image" content="https://YOURDOMAIN.com/seo/og-image-1200x630.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<!-- Twitter / X -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://YOURDOMAIN.com/seo/twitter-card-1200x600.jpg">

<!-- Google: organisation logo -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "CloutLabs",
  "url": "https://YOURDOMAIN.com",
  "logo": "https://YOURDOMAIN.com/seo/schema-logo-512x512.png",
  "slogan": "Connecting content creators. Empowering growth."
}
</script>

<!-- Header logo with light and dark switching -->
<picture>
  <source srcset="/logo/cloutlabs-logo-horizontal-reversed.png 1x, /logo/cloutlabs-logo-horizontal-reversed@2x.png 2x" media="(prefers-color-scheme: dark)">
  <img src="/logo/cloutlabs-logo-horizontal.png" srcset="/logo/cloutlabs-logo-horizontal@2x.png 2x" alt="CloutLabs" height="64">
</picture>
